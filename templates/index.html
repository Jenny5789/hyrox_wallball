<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HYROX Squat Depth Judge</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>🏋️ HYROX Squat Depth Judge</h1>
            <p>AI로 스쿼트 깊이를 자동 판정합니다</p>
        </header>
        
        <main>
            <!-- 웹캠 피드 -->
            <section class="video-section">
                <div class="video-container">
                    <img id="video-feed" src="/video_feed" alt="Live Video Feed">
                </div>
            </section>
            
            <!-- 실시간 데이터 -->
            <section class="data-section">
                <div class="stat-card">
                    <div class="stat-label">무릎 각도</div>
                    <div class="stat-value" id="angle">--°</div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-label">좌측 무릎</div>
                    <div class="stat-value" id="left-knee">--°</div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-label">우측 무릎</div>
                    <div class="stat-value" id="right-knee">--°</div>
                </div>
                
                <div class="stat-card verdict-card">
                    <div class="stat-label">판정 결과</div>
                    <div class="stat-value" id="depth">READY</div>
                </div>
            </section>
            
            <!-- 프레임 카운트 -->
            <section class="info-section">
                <p id="frame-count">프레임: 0</p>
            </section>
        </main>
    </div>
    
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
